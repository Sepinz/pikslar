# Publishes site/ to GitHub Pages (docs/site/README.md). Runs only on pushes to main that touch
# the site, or by hand. Before the first run, set Settings > Pages > Source to "GitHub Actions".
#
# The site is plain HTML and CSS with no build tool. This workflow copies it, then writes in what
# only the repository knows: its name (for the source, issues and releases links) and the
# absolute addresses that canonical links and social previews need. The source files keep none
# of these, so nothing in them points at a guessed address.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Prepare the site
        env:
          REPOSITORY: ${{ github.repository }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -eu
          rm -rf _site
          cp -R site _site
          base="${BASE_URL%/}"
          for page in _site/*.html; do
            name="$(basename "$page")"
            [ "$name" = "index.html" ] && url="$base/" || url="$base/$name"
            sed -i \
              -e "s|<meta name=\"pikslar-repository\" content=\"\">|<meta name=\"pikslar-repository\" content=\"$REPOSITORY\">|" \
              -e "s|<link rel=\"canonical\" href=\"[^\"]*\">|<link rel=\"canonical\" href=\"$url\">\n<meta property=\"og:url\" content=\"$url\">|" \
              -e "s|<meta property=\"og:image\" content=\"assets/og.png\">|<meta property=\"og:image\" content=\"$base/assets/og.png\">|" \
              "$page"
          done
          # Every page must have been rewritten, or the previews would point nowhere.
          if grep -lE 'content="assets/og\.png"|name="pikslar-repository" content=""' _site/*.html; then
            echo "these pages were not rewritten"; exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
